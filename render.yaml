services:
  # Backend Django Web Service
  - type: web
    name: attendance-backend
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    rootDir: backend
    plan: free
    region: singapore
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      - key: NUM_PROXIES
        value: "1"
      - key: DEFAULT_OFFICE_IP
        value: "223.236.99.39"
      - key: DEFAULT_OFFICE_TIMEZONE
        value: "Asia/Kolkata"

databases:
  # Free PostgreSQL Database Instance
  - name: attendance-db
    databaseName: attendance_db
    user: attendance_user
    plan: free
    region: singapore
